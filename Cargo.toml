[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["The Audiform27 contributors"]
repository = "https://github.com/nwh212/Audiform27"
rust-version = "1.80"

[workspace.dependencies]
af27-core = { path = "crates/af27-core" }
af27-io = { path = "crates/af27-io" }
af27-dsp = { path = "crates/af27-dsp" }
af27-engine = { path = "crates/af27-engine" }
af27-separation = { path = "crates/af27-separation" }
af27-interop = { path = "crates/af27-interop" }
af27-dts = { path = "crates/af27-dts" }
af27-space = { path = "crates/af27-space" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.4", features = ["all"] }
hound = "3.5"
cpal = "0.15"
rtrb = "0.3"
sha2 = "0.10"
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
rfd = "0.15"

# Audio code is far too slow unoptimised; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
