[package]
name = "audiform27"
description = "Audiform27: a fast, themeable, all-Rust audio editor"
version.workspace = true
edition.workspace = true
license-file = "../LICENSE"
authors.workspace = true

[[bin]]
name = "audiform27"
path = "src/main.rs"

[dependencies]
af27-core.workspace = true
af27-io.workspace = true
af27-dsp.workspace = true
af27-engine.workspace = true
af27-separation.workspace = true
af27-interop.workspace = true
af27-fx = { path = "../crates/af27-fx" }
af27-space.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
egui_dock = { version = "0.14", features = ["serde"] }
