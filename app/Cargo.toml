[package]
name = "audiform2"
description = "Audiform2: a fast, themeable, all-Rust audio editor"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true

[[bin]]
name = "audiform2"
path = "src/main.rs"

[dependencies]
af2-core.workspace = true
af2-io.workspace = true
af2-dsp.workspace = true
af2-engine.workspace = true
af2-separation.workspace = true
af2-interop.workspace = true
af2-fx = { path = "../crates/af2-fx" }
af2-vst3 = { path = "../crates/af2-vst3" }
af2-space.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Session archives (.audarc) are zips (MIT; already in the tree).
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
raw-window-handle = "0.6"
egui_dock = { version = "0.14", features = ["serde"] }
# MIDI input (MIT).
midir = "0.10.4"
rtrb.workspace = true

# The System theme follows the desktop on the XDG Settings portal. All
# three are already in the tree through rfd (MIT / Apache-2.0).
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util = { version = "0.3", default-features = false }
pollster = "0.4"
# Files dropped from the file manager on Wayland, where winit gives none:
# a data device on the window's own display connection (MIT; both already
# in the tree through winit and smithay-clipboard).
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
# poll(), to wait on that connection with a timeout (already in the tree).
libc = "0.2"

# The System theme reads Windows' light or dark mode and accent from the
# registry (MIT; already in the tree through embed-resource).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
# Builds the icon into the exe (MIT/Apache-2.0).
embed-resource = "3"

[dev-dependencies]
# Checks the caustics shader in tests (already in the tree through wgpu).
naga = { version = "22", features = ["wgsl-in"] }

[features]
# ASIO on Windows (off by default): see docs/asio.md.
asio = ["af2-engine/asio"]
