[package]
name = "audiform2"
description = "Audiform27: a fast, themeable, all-Rust audio editor"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true

[[bin]]
name = "audiform2"
path = "src/main.rs"

[dependencies]
af27-core.workspace = true
af27-io.workspace = true
af27-dsp.workspace = true
af27-engine.workspace = true
af27-separation.workspace = true
af27-interop.workspace = true
af27-fx = { path = "../crates/af27-fx" }
af27-vst3 = { path = "../crates/af27-vst3" }
af27-space.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe.workspace = true
egui.workspace = true
rfd.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
raw-window-handle = "0.6"
egui_dock = { version = "0.14", features = ["serde"] }
# MIDI input (MIT).
midir = "0.10.4"
rtrb.workspace = true

[target.'cfg(windows)'.build-dependencies]
# Builds the icon into the exe (MIT/Apache-2.0).
embed-resource = "3"

[dev-dependencies]
# Checks the caustics shader in tests (already in the tree through wgpu).
naga = { version = "22", features = ["wgsl-in"] }

[features]
# ASIO on Windows (off by default): see docs/asio.md.
asio = ["af27-engine/asio"]
