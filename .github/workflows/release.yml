name: Release builds (Linux, macOS, Windows)

# Builds the Linux, macOS and Windows programs for a release and attaches
# them to it. Runs when a release is published, or by hand for an existing
# tag (Actions > Release builds > Run workflow, or
# `gh workflow run release.yml -f tag=v2.1.0`).
#
# The Windows job builds the ordinary program (the system driver, WASAPI;
# no ASIO) as a .zip. The Windows program with ASIO is still built on the
# lead's machine and attached by hand as AudiForm2-<version>-windows-x64.exe:
# that is the file in-app updates install (any asset ending
# `-windows-x64.exe`, see app/src/updater.rs), so this job's file must never
# end that way, and it never overwrites it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v2.1.0)"
        required: true
      ref:
        description: "Source to build, if not the tag itself (e.g. main for a build fix)"
        required: false
        default: ""
      skip_macos:
        description: "Leave out the macOS build"
        type: boolean
        default: false
      skip_windows:
        description: "Leave out the Windows build"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  SRC: ${{ inputs.ref || github.event.release.tag_name || inputs.tag }}
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # 22.04: an older glibc, so the program runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libxkbcommon-dev libwayland-dev libudev-dev
      - run: cargo build --release -p audiform2
      # For the Flatpak job.
      - uses: actions/upload-artifact@v4
        with:
          name: audiform2-linux
          path: target/release/audiform2
      - name: Package
        run: |
          V="${TAG#v}"
          D="AudiForm2-${V}-linux-x64"
          mkdir -p "$D"
          cp target/release/audiform2 "$D/audiform2"
          cp assets/icon/audiform2-256.png "$D/audiform2.png"
          cp LICENSE "$D/"
          cat > "$D/README.txt" <<'EOF'
          AudiForm 2 for Linux (x86-64)

          Run ./audiform2 from this folder. It needs ALSA (libasound2), which
          almost every desktop distribution has. Settings are kept in
          ~/.local/share/Audiform2.

          Linux builds are still lightly tested: please report problems at
          https://github.com/AudiFormer/AudiForm2/issues
          EOF
          sed -i 's/^          //' "$D/README.txt"
          chmod +x "$D/audiform2"
          tar -czf "$D.tar.gz" "$D"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" AudiForm2-*-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  flatpak:
    # The same Linux program in a Flatpak bundle (a .flatpak file people
    # open or `flatpak install`); the runtime comes from Flathub.
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: actions/download-artifact@v4
        with:
          name: audiform2-linux
          path: packaging/flatpak
      - name: Flatpak tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Build the bundle
        run: |
          V="${TAG#v}"
          ID=io.github.audiformer.AudiForm2
          flatpak-builder --user --install-deps-from=flathub --force-clean             --repo=repo build "packaging/flatpak/$ID.yml"
          flatpak build-bundle repo "AudiForm2-${V}-linux-x64.flatpak" "$ID"             --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" AudiForm2-*-linux-x64.flatpak --clobber --repo "$GITHUB_REPOSITORY"

  appimage:
    # The same Linux program as an AppImage (one file people make
    # executable and run). Built from the 22.04 program, so it runs on
    # distributions with glibc 2.35 or newer.
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: actions/download-artifact@v4
        with:
          name: audiform2-linux
          path: dist
      - name: appimagetool
        run: |
          # appimagetool checks the desktop entry and stops without this.
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  appimagetool" | sha256sum -c -
          chmod +x appimagetool dist/audiform2
      - name: Build the AppImage
        env:
          # No FUSE on the runners: appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: APPIMAGETOOL="$PWD/appimagetool" packaging/appimage/build-appimage.sh dist/audiform2 "${TAG#v}"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" AudiForm2-*-linux-x64.AppImage --clobber --repo "$GITHUB_REPOSITORY"

  macos:
    if: ${{ !inputs.skip_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple silicon and Intel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release -p audiform2 --target aarch64-apple-darwin
          cargo build --release -p audiform2 --target x86_64-apple-darwin
      - name: Make the app
        run: |
          V="${TAG#v}"
          APP="AudiForm 2.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/audiform2 \
            target/x86_64-apple-darwin/release/audiform2 \
            -output "$APP/Contents/MacOS/AudiForm2"
          # The icon from the 256 px picture (and its half sizes).
          ICON=icon.iconset
          mkdir -p "$ICON"
          for s in 16 32 64 128 256; do
            sips -z $s $s assets/icon/audiform2-256.png --out "$ICON/icon_${s}x${s}.png" >/dev/null
          done
          cp "$ICON/icon_32x32.png" "$ICON/icon_16x16@2x.png"
          cp "$ICON/icon_64x64.png" "$ICON/icon_32x32@2x.png"
          cp "$ICON/icon_256x256.png" "$ICON/icon_128x128@2x.png"
          rm "$ICON/icon_64x64.png"
          iconutil -c icns "$ICON" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>AudiForm 2</string>
            <key>CFBundleDisplayName</key><string>AudiForm 2</string>
            <key>CFBundleIdentifier</key><string>io.github.audiformer.audiform2</string>
            <key>CFBundleExecutable</key><string>AudiForm2</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${V}</string>
            <key>CFBundleVersion</key><string>${V}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSMicrophoneUsageDescription</key><string>AudiForm 2 records from your microphone or audio interface.</string>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          # Ad-hoc signed (no developer certificate): Apple silicon needs a
          # signature to run at all.
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "AudiForm2-${V}-macos-universal.zip"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" AudiForm2-*-macos-universal.zip --clobber --repo "$GITHUB_REPOSITORY"

  windows:
    if: ${{ !inputs.skip_windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SRC }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The icon and version go into the .exe (app/build.rs, through the
      # Windows SDK the runner has).
      - run: cargo build --release -p audiform2
      - name: Package
        run: |
          $V = $env:TAG -replace '^v', ''
          $D = "AudiForm2-$V-windows-x64-wasapi"
          New-Item -ItemType Directory -Force -Path $D | Out-Null
          Copy-Item target/release/audiform2.exe "$D/AudiForm2.exe"
          Copy-Item LICENSE "$D/LICENSE.txt"
          @"
          AudiForm 2 for Windows (x64), without ASIO

          Run AudiForm2.exe from this folder; nothing needs installing. It plays
          and records through Windows' own audio (WASAPI). Settings are kept in
          %APPDATA%\Audiform2.

          For ASIO drivers, download AudiForm2-$V-windows-x64.exe from the same
          release page instead (that is also the build in-app updates install).

          Please report problems at https://github.com/AudiFormer/AudiForm2/issues
          "@ | Set-Content -Encoding utf8 "$D/README.txt"
          Compress-Archive -Path $D -DestinationPath "$D.zip" -Force
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-Item AudiForm2-*-windows-x64-wasapi.zip).Name --clobber --repo "$env:GITHUB_REPOSITORY"
