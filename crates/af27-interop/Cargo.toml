[package]
name = "af27-interop"
description = "Audiform27 project import: .sesx multitrack sessions and Audiform .audfrm / .altaudio"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true

[dependencies]
af27-core.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
roxmltree = "0.20"
af27-dsp = { path = "../af27-dsp" }
af27-fx = { path = "../af27-fx" }
midly = { version = "0.5.3", default-features = false, features = ["std"] }
