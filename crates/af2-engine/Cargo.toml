[package]
name = "af2-engine"
description = "Audiform2 real-time playback and recording"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true

[dependencies]
af2-core.workspace = true
cpal.workspace = true
rtrb.workspace = true
serde.workspace = true
af2-dsp.workspace = true
af2-space.workspace = true
rustysynth = "1.3.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Wdk_System_SystemServices",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.58"

[features]
# ASIO on Windows (off by default). Needs LLVM (libclang) and the
# Steinberg ASIO SDK (used under its GPLv3 option) to build: see
# docs/asio.md.
asio = ["cpal/asio", "dep:asio-sys"]

# Loads one ASIO driver by name (cpal's own listing loads every driver).
[target.'cfg(windows)'.dependencies.asio-sys]
version = "0.2"
optional = true
