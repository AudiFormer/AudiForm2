[package]
name = "af27-fx"
description = "Audiform27 effects: amp model, tube, delay, reverbs, modulation, stereo tools, vox strip"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
authors.workspace = true

[dependencies]
af27-core = { path = "../af27-core" }
af27-dsp = { path = "../af27-dsp" }
af27-io = { path = "../af27-io" }
realfft = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3.5"
