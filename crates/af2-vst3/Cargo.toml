[package]
name = "af2-vst3"
description = "AudiForm 2 VST3 hosting: plug-ins run in a separate process (the app started again with --plugin-host), scanned in another"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
authors.workspace = true

[[bin]]
# A stand-alone host for this crate's own tests; the app hosts plug-ins by
# starting itself again with --plugin-host.
name = "af2-plughost"
path = "src/bin/af2-plughost.rs"
test = false

[dependencies]
af2-core.workspace = true
af2-dsp.workspace = true
serde.workspace = true
serde_json.workspace = true
rtrb.workspace = true
# MIT or Apache-2.0: bindings generated from the VST 3 SDK headers (MIT).
vst3 = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
af2-engine.workspace = true
